<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>用户登录系统</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>

tailwind.config = {

    theme:{
        extend:{
            colors:{
                primary:'#4F46E5'
            }
        }
    }

}

</script>

<style>

.card-shadow{

box-shadow:
0 10px 25px -5px rgba(0,0,0,0.1),
0 8px 10px -6px rgba(0,0,0,0.05);

}

.toast{

position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:12px 24px;
border-radius:8px;
color:white;
z-index:9999;

}

</style>

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<!-- 提示框 -->

<div id="toastBox"></div>

<!-- 登录中心 -->

<div id="loginPage" class="w-full max-w-md">

<div class="bg-white rounded-xl card-shadow p-8">

<!-- 标题 -->

<div class="text-center mb-8">

<h2 class="text-3xl font-bold text-gray-800">

用户中心

</h2>

<p class="text-gray-500 mt-2">

商城用户登录

</p>

</div>

<!-- 标签 -->

<div class="flex mb-6 bg-slate-100 rounded-lg p-1">

<button
id="tabLogin"
onclick="switchTab('login')"
class="flex-1 py-2 rounded-md bg-white text-primary">

登录

</button>

<button
id="tabRegister"
onclick="switchTab('register')"
class="flex-1 py-2 rounded-md text-gray-600">

注册

</button>

<button
id="tabDelete"
onclick="switchTab('delete')"
class="flex-1 py-2 rounded-md text-gray-600">

注销

</button>

</div>

<!-- ==================== 登录 ==================== -->

<form
method="POST"
action="/login"
id="loginForm">

<div class="mb-4">

<label class="block text-gray-700 mb-1">

账号

</label>

<input

type="text"

name="Username"

placeholder="请输入账号"

class="w-full border rounded-lg px-4 py-3"

>

</div>

<div class="mb-6">

<label class="block text-gray-700 mb-1">

密码

</label>

<input

type="password"

name="loginPwd"

placeholder="请输入密码"

class="w-full border rounded-lg px-4 py-3"

>

</div>

<button

type="submit"

class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg">

立即登录

</button>

</form>

<!-- ==================== 注册 ==================== -->

<div id="registerForm" class="hidden">

<div class="mb-4">

<label class="block text-gray-700 mb-1">

账号

</label>

<input

id="regUsername"

type="text"

placeholder="请输入注册账号"

class="w-full border rounded-lg px-4 py-3"

>

</div>

<div class="mb-6">

<label class="block text-gray-700 mb-1">

密码

</label>

<input

id="regPwd"

type="password"

placeholder="请输入注册密码"

class="w-full border rounded-lg px-4 py-3"

>

</div>

<button

type="button"

onclick="register()"

class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg">

完成注册

</button>

</div>

<!-- ==================== 注销 ==================== -->

<div id="deleteForm" class="hidden">

<div class="mb-4">

<label class="block text-gray-700 mb-1">

账号

</label>

<input

id="delUser"

type="text"

placeholder="请输入账号"

class="w-full border rounded-lg px-4 py-3"

>

</div>

<div class="mb-6">

<label class="block text-gray-700 mb-1">

密码

</label>

<input

id="delPwd"

type="password"

placeholder="请输入密码"

class="w-full border rounded-lg px-4 py-3"

>

</div>

<button

type="button"

onclick="deleteUser()"

class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg">

注销账号

</button>

</div>

</div>

</div>

<script>


/* ==================== 切换登录 / 注册 / 注销 ==================== */

function switchTab(type){

    let login = document.getElementById("loginForm");

    let reg = document.getElementById("registerForm");

    let del = document.getElementById("deleteForm");

    let tabs = [

        document.getElementById("tabLogin"),

        document.getElementById("tabRegister"),

        document.getElementById("tabDelete")

    ];


    /* 清除所有 Tab 的选中状态 */

    tabs.forEach(function(t){

        t.classList.remove(
            "bg-white",
            "text-primary"
        );

        t.classList.add("text-gray-600");

    });


    /* 隐藏所有表单 */

    login.classList.add("hidden");

    reg.classList.add("hidden");

    del.classList.add("hidden");


    /* 显示对应表单 */

    if(type == "login"){

        login.classList.remove("hidden");

        document.getElementById("tabLogin")
        .classList.add("bg-white","text-primary");

    }


    if(type == "register"){

        reg.classList.remove("hidden");

        document.getElementById("tabRegister")
        .classList.add("bg-white","text-primary");

    }


    if(type == "delete"){

        del.classList.remove("hidden");

        document.getElementById("tabDelete")
        .classList.add("bg-white","text-primary");

    }

}


/* ==================== 提示框 ==================== */

function showToast(msg, success = true){

    let box = document.getElementById("toastBox");

    let div = document.createElement("div");

    if(success){

        div.className = "toast bg-green-500";

    }
    else{

        div.className = "toast bg-red-500";

    }

    div.innerHTML = msg;

    box.appendChild(div);


    setTimeout(function(){

        div.remove();

    },2000);

}


/* ==================== 注册 ==================== */

function register(){

    let username =
        document.getElementById("regUsername").value.trim();

    let password =
        document.getElementById("regPwd").value;


    /* 检查输入 */

    if(username == "" || password == ""){

        showToast("账号和密码不能为空", false);

        return;

    }


    /* 用户名长度检查 */

    if(username.length < 2){

        showToast("账号至少需要2个字符", false);

        return;

    }


    /* 密码长度检查 */

    if(password.length < 3){

        showToast("密码至少需要3个字符", false);

        return;

    }


    /*
     * 向 C 后台发送注册请求
     *
     * POST /register
     *
     * Username=xxx&loginPwd=xxx
     */

    let xhr = new XMLHttpRequest();


    xhr.open(
        "POST",
        "/register",
        true
    );


    xhr.setRequestHeader(
        "Content-Type",
        "application/x-www-form-urlencoded"
    );


    xhr.onreadystatechange = function(){

        if(xhr.readyState == 4){

            if(xhr.status == 200){

                let result = xhr.responseText;

                /*
                 * C 后台如果返回：
                 *
                 * 注册成功
                 *
                 * 或：
                 *
                 * 用户名已存在
                 *
                 */

                if(
                    result.indexOf("成功") != -1
                ){

                    showToast(result, true);


                    /*
                     * 注册成功以后清空输入框
                     */

                    document.getElementById(
                        "regUsername"
                    ).value = "";

                    document.getElementById(
                        "regPwd"
                    ).value = "";


                    /*
                     * 自动切换回登录页面
                     */

                    setTimeout(function(){

                        switchTab("login");

                    },1000);

                }
                else{

                    showToast(result, false);

                }

            }
            else{

                showToast(
                    "服务器连接失败",
                    false
                );

            }

        }

    };


    /*
     * encodeURIComponent 防止用户名、
     * 密码中的特殊字符破坏 POST 数据
     */

    let data =
        "Username=" +
        encodeURIComponent(username) +
        "&loginPwd=" +
        encodeURIComponent(password);


    xhr.send(data);

}


/* ==================== 注销 ==================== */

function deleteUser(){

    showToast(
        "注销功能暂未连接C后台",
        false
    );

}

</script>

</body>

</html>
